name: Daily cleanup

# טיוטות שלא אומתו תוך 30 יום, קבצים שהועלו ולא נשלחו, ומכסת בדיקות ישנה, נמחקים פעם ביום (מדיניות הפרטיות).
# schedule רץ רק מהענף הראשי של המאגר (main). עד שהענף ימוזג ל-main הניקוי לא ירוץ לבד.
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # הכתובת של הפרויקט בענן אינה סוד (היא גם ב-docs/STATUS.md). המפתח הסודי רק ב-GitHub Secrets,
      # ו-GitHub מסתיר אותו ביומן. הסקריפט מדפיס רק את הכתובת והמספרים.
      NEXT_PUBLIC_SUPABASE_URL: https://bndxpogjvzhouoljiwrc.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - name: Skip without the secret key
        id: gate
        run: |
          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::notice::SUPABASE_SECRET_KEY is not in GitHub Secrets yet. Skipping the cleanup."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web
        if: steps.gate.outputs.run == 'true'
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Clean up drafts and proofs
        if: steps.gate.outputs.run == 'true'
        working-directory: web
        run: pnpm proofs:cleanup
